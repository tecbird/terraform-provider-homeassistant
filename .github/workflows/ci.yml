name: CI

on:
  pull_request:
  # Started by vuln-fix.yml for its pull request, which its token cannot trigger (ADR-0027).
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A new push to a PR supersedes the run for the previous one. Every commit on main is tested.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Lint, formatting, `go mod tidy` and docs freshness: the same hooks contributors run locally.
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: pre-commit
        run: |
          pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure
        env:
          # Unit tests run in their own job.
          SKIP: go-test

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -short -race ./...

  # PR branches are rebased onto main, never merged with it: main gets one merge commit per PR,
  # and the branch itself stays linear. (A ruleset can't express this: GitHub's "linear history"
  # rule also counts main's own merge commits.) Started by hand on a branch, it checks that branch
  # against main.
  rebased:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The PR head itself, not the merge commit GitHub creates for testing it.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: no merge commits on the branch
        env:
          BASE: ${{ github.event.pull_request.base.ref || 'main' }}
        run: |
          merges="$(git rev-list --merges "origin/$BASE..HEAD")"
          if [ -n "$merges" ]; then
            echo "::error::This branch contains merge commits. Rebase onto $BASE instead of merging it:"
            git log --oneline --no-walk $merges
            exit 1
          fi
