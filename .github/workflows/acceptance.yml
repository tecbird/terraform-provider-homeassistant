name: Acceptance tests

on:
  pull_request:
  # Started by vuln-fix.yml for its pull request, which its token cannot trigger (ADR-0027).
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A new push to a PR supersedes the run for the previous one. Every commit on main is tested.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  acceptance:
    # The names of the `latest` cells are required checks in the `main` ruleset: keep them.
    name: Acceptance (HA ${{ matrix.ha }}${{ matrix.tofu != 'latest' && format(', OpenTofu {0}', matrix.tofu) || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Oldest and newest release of the support window (ADR-0003). See "Bumping the Home
        # Assistant versions" in README.md.
        ha: ["2026.6.4", "2026.11.0"]
        tofu: ["latest"]
        # The oldest supported OpenTofu (ADR-0016), once, against the oldest HA.
        include:
          - ha: "2026.6.4"
            tofu: "1.8.x"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ matrix.tofu }}
          tofu_wrapper: false
      - name: Pull Home Assistant image
        run: docker pull ghcr.io/home-assistant/home-assistant:${{ matrix.ha }}
      - name: Run acceptance tests
        env:
          TF_ACC: "1"
          TF_ACC_PROVIDER_NAMESPACE: toelke
          TF_ACC_PROVIDER_HOST: registry.opentofu.org
          HOMEASSISTANT_IMAGE_TAG: ${{ matrix.ha }}
        run: TF_ACC_TERRAFORM_PATH="$(which tofu)" go test -run '^TestAcc' -timeout 20m -v ./...
